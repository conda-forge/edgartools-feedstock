schema_version: 1

context:
  name: edgartools
  version: "5.59.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/edgartools-${{ version }}.tar.gz
  sha256: 818a837465ae19b5afc851de7fddbefca257bf6251e5a60dce8417e057037836

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.26.3
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.25.0
    - pandas >=2.0.0
    - tabulate >=0.9.0
    - pyarrow >=17.0.0
    - beautifulsoup4 >=4.10.0
    - lxml >=4.4
    - rich >=13.8.0
    - humanize >=4.0.0
    - stamina >=24.2.0
    - orjson >=3.6.0
    - textdistance >=4.5.0
    - rank-bm25 >=0.2.1
    - rapidfuzz >=3.5.0
    - unidecode >=1.2.0
    - pydantic >=2.0.0
    - tqdm >=4.62.0
    - nest-asyncio >=1.5.1
    - jinja2 >=3.1.0
    - httpxthrottlecache >=0.3.0
    - truststore >=0.9.0
    - pyrate-limiter >=3.0.0

tests:
  - python:
      imports:
        - edgar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Navigate Edgar filings with ease
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/dgunning/edgartools
  repository: https://github.com/dgunning/edgartools

extra:
  recipe-maintainers:
    - faceprint
