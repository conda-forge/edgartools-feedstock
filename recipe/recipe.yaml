schema_version: 1

context:
  name: edgartools
  version: "6.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/edgartools-${{ version }}.tar.gz
  sha256: 9bb1dfee8bed2bd869a27d941adcd915f029a84b9de61da01c763a31905a45fd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.26.3
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.25.0,<0.29
    - pandas >=2.0.0
    - tabulate >=0.9.0
    - pyarrow >=23.0.1
    - beautifulsoup4 >=4.10.0
    - lxml >=6.1.3
    - rich >=13.8.0
    - humanize >=4.0.0
    - stamina >=24.2.0
    - orjson >=3.11.6
    - textdistance >=4.5.0
    - rank-bm25 >=0.2.1
    - rapidfuzz >=3.5.0
    - unidecode >=1.2.0
    - pydantic >=2.4.0
    - tqdm >=4.66.3
    - nest-asyncio >=1.5.1
    - jinja2 >=3.1.6
    - httpxthrottlecache >=0.6.1
    - truststore >=0.9.0
    - pyrate-limiter >=3.0.0
    - certifi >=2026.10.19

tests:
  - python:
      imports:
        - edgar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Navigate Edgar filings with ease
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/dgunning/edgartools
  repository: https://github.com/dgunning/edgartools

extra:
  recipe-maintainers:
    - faceprint
    - jsmolic
